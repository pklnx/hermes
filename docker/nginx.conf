# nginx configuration for the hermes.pklnx.space landing page.
#
# Design goals:
#   * runs unprivileged: non-root user, port 8080, no capabilities,
#     read-only root filesystem (everything writable lives under /tmp)
#   * no client IP addresses in the access log (see "Logging" below)
#   * strict CSP: the page loads nothing but itself and its own webfonts — that
#     is what keeps the site consent-free

worker_processes auto;

# /tmp is the only writable location, so the pid file lives there. nginx creates
# the temp path directories below on its own at startup.
pid /tmp/nginx.pid;

# Log to the container's stdout/stderr so `docker logs` picks everything up.
# Writing to the standard streams directly (rather than to files under
# /var/log/nginx) also keeps the root filesystem read-only.
#
# Careful: unlike the access log below, nginx always stamps the client IP into
# error log entries and offers no way to format that away. Failed requests
# (404, 403) are logged at "error" level and therefore do carry an IP. Set this
# to "crit" if you want the error log free of IPs as well — at the price of no
# longer seeing broken links.
error_log /dev/stderr error;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep every writable path under /tmp so the container can run with a
    # read-only root filesystem (compose mounts a tmpfs on /tmp). These have to
    # be one level below /tmp: nginx creates the leaf directory at startup, but
    # not intermediate parents.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # --- Logging ------------------------------------------------------------
    # The site sets no cookies and runs no trackers, so the logs are the only
    # place personal data could show up. The access log therefore records
    # everything except the client IP address. If you ever need IPs (abuse
    # defence, for example), switch access_log to nginx's built-in "combined"
    # format.
    log_format privacy '[$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout privacy;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    charset       utf-8;
    charset_types text/css text/plain text/xml application/json image/svg+xml;

    keepalive_timeout    30s;
    client_max_body_size 1m;  # nothing is ever uploaded to this site

    # text/html is always included when gzip is on and must not be repeated in
    # gzip_types — nginx warns about a duplicate MIME type otherwise.
    # This server does not serve anything else, so the list stays empty.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_comp_level 6;

    server {
        # IPv4 only on purpose: a container network without IPv6 would make
        # nginx fail to start on a `listen [::]:8080`, and public IPv6 is
        # handled by the host port mapping / reverse proxy in front of us
        # anyway. Add that listen directive only on an IPv6-enabled network.
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Emit relative redirects: behind a TLS reverse proxy an absolute one
        # would leak the internal "http://<host>:8080" origin.
        absolute_redirect off;

        # --- Security headers ------------------------------------------------
        # CAREFUL: add_header is not inherited additively — as soon as a location
        # block sets its own add_header, ALL headers set here are dropped for that
        # block. That is why they live here and in no location block.
        #
        # The CSP pins down what the page already does: no scripts, no external
        # sources, styles inline only, images only as data: URIs (the favicon),
        # fonts from this origin only (self-hosted IBM Plex Mono and IBM Plex Sans — 'self'
        # is what a fonts.googleapis.com URL would fail against). It breaks the
        # page the moment somebody adds an external resource — which is the
        # point, because consent-free operation depends on it.
        add_header Content-Security-Policy    "default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options     "nosniff"     always;
        add_header X-Frame-Options            "DENY"        always;
        add_header Referrer-Policy            "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy         "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        # HSTS belongs on whatever terminates TLS in front of this container.
        # Uncomment only if this container is itself the HTTPS endpoint:
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Five minutes is short enough that a content change is picked up on the
        # next visit and long enough to spare a reload. Do not add a
        # Cache-Control header next to this — `expires` emits one itself and the
        # response would end up carrying two contradictory values.
        expires 5m;

        # Liveness probe for Docker / Kubernetes / uptime monitoring. A separate
        # endpoint keeps health traffic out of the page's access log and out of
        # the caching rule above.
        location = /healthz {
            access_log   off;
            default_type text/plain;
            # Never cache a liveness answer — a proxy holding on to a stale "ok"
            # for five minutes would defeat the point of probing.
            expires      -1;
            return 200 "ok\n";
        }

        # There is exactly one page. Anything else is a typo and gets a 404 —
        # which also makes an explicit deny for dotfiles unnecessary, since the
        # catch-all below already answers every other path with 404.
        location = / {
            try_files /index.html =404;
        }

        # The self-hosted webfonts, plus the OFL licence texts that have to travel
        # with them. "^~" so this prefix wins over the catch-all 404 below.
        location ^~ /fonts/ {
            # Only two kinds of file live here, and spelling their types out
            # keeps them right even if a future base image ships a mime.types
            # without woff2. A `types` block replaces the inherited table for
            # this location, so anything else served from here would fall back
            # to default_type — which is why nothing else belongs here.
            types {
                font/woff2 woff2;
                text/plain txt;
            }

            # Longer than the page's five minutes, because the font changes
            # about as often as never and re-downloading it on every visit is
            # pure waste. The file names carry no version, so a font update does
            # take up to a month to reach a returning visitor — harmless, since
            # the page keeps rendering in the copy the browser already has.
            # Note that `expires` is not add_header: the security headers from
            # the server block still apply here.
            expires 30d;

            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
