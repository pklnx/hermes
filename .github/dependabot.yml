# The weekly rebuild in .github/workflows/docker.yml is what keeps nginx itself
# current: the Dockerfile tracks the unpinned nginx:alpine tag, so a rebuild
# picks up patches and new minors alike. There is deliberately no "docker"
# ecosystem entry here — with no version in the tag Dependabot would have
# nothing to bump. Add one if the base image is ever pinned to a minor.
#
# The workflow's own actions (checkout, qemu, buildx, login, metadata,
# build-push) age all the same, and a deprecated major eventually stops running
# without warning. (Keeping the Monday rebuild from being disabled after 60
# days without a commit is the keepalive job's task in docker.yml, not this
# file's.)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Update"
    labels:
      - "dependencies"
